<script>
"use strict";
/*COST:BEGIN*/
/* ARTO — فرمول قیمت‌گذاری ابزارها (تنها منبع حقیقت؛ همین متن داخل index.html هم جاسازی می‌شود)
   هزینه = (پایه + بر اساس مدت) × ضریب وضوح/حجم × ضریب گزینه‌ها × ضریب پلن   (به ARTO، رو به بالا گرد می‌شود)
   هر ARTO = ۱۰۰ تومان */
(function(g){
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,+v||a));
  const pick=(v,tbl,d)=>(v in tbl)?tbl[v]:tbl[d];
  const resM=h=>h<=720?1:h<=1080?1.3:h<=1440?1.6:2.1;          /* ضریب وضوح ویدئوی ورودی */
  const mpM=p=>p<=2?1:p<=6?1.3:1.6;                             /* ضریب اندازهٔ عکس (مگاپیکسل) */
  function cost(tool,mul,o){
    o=o||{};const min=Math.max(1,Math.ceil((+o.sec||0)/60)),h=+o.h||720,px=+o.px||1;let c=0;
    switch(tool){
      case 'resize':{const W={'1:1':1,'9:16':1.5,'16:9':1.5},ls=Array.isArray(o.sizes)&&o.sizes.length?o.sizes:['1:1','9:16','16:9'];
        c=(1+ls.reduce((t,k)=>t+(W[k]||1)*(o.mode==='fit'?1.4:1),0))*mpM(px);break}
      case 'removebg':c=6*mpM(px)+((o.bg&&o.bg!=='transparent')?1:0);break;

function pfPick(i){if(!PS)return;PS.sel=i;document.querySelectorAll('#pfg button').forEach((b,k)=>b.classList.toggle('on',k===i));pfBig()}
function pfShape(s,b){if(!PS)return;PS.shape=s;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));pfDraw()}
async function pfSave(btn){if(!PS||btn.disabled)return toast('اول یک عکس انتخاب کنید');btn.disabled=true;const t0=btn.textContent;btn.textContent='در حال ساخت…';
 try{await new Promise(r=>setTimeout(r,30));const c=pfRender(PRF[PS.sel][0],PS.big,1024,PS.shape),blob=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('png')),'image/png'));
  const r=await fetch(API+'/api/logo/save',{method:'POST',headers:{'content-type':'image/png','x-wk':wk,'x-kind':'profile'},body:blob});let j={};try{j=await r.json()}catch(e){}
  if(r.status===402){toast('اعتبار کافی نیست؛ '+fn(j.need||2)+' آرتو لازم است');setBal(j.bal||0)}
  else if(!r.ok||!j.out)toast('ساخت پروفایل ناموفق بود؛ دوباره تلاش کنید');
  else{setBal(j.bal);sfx.ok();showRes(j)}}
 catch(e){toast('ساخت پروفایل ناموفق بود؛ دوباره تلاش کنید')}
 btn.disabled=false;btn.textContent=t0}

function vSum(){TS.opt={style:'short',len:0};$('tb').innerHTML=`${cfg.ai.text?'':'<div class="sub" style="margin-bottom:6px">خلاصه‌ساز هوشمند: عنوان و موضوع متن را تشخیص می‌دهد، جمله‌های کلیدی را پیدا می‌کند، تکراری‌ها را کنار می‌گذارد و عبارت‌های مهم را درمی‌آورد؛ به‌علاوه زمان مطالعه‌ای که صرفه‌جویی می‌کنید. جمله‌ها بازنویسی نمی‌شوند.</div>'}<div class="lb">متن را اینجا بچسبانید</div><textarea id="st" placeholder="حداقل ۸۰ حرف…" oninput="TS.opt.len=this.value.length;updCost()"></textarea>${seg('style',[['oneline','یک‌جمله‌ای'],['short','کوتاه'],['bullets','نکته‌ای'],['detailed','کامل']],'short')}`+costLine()+`<button class="btn w" id="sb" onclick="runText('summarize',this)">خلاصه کن</button><div id="rs"></div>`;updCost()}
function vCap(){TS.opt={src:'text',platform:'instagram',tone:'friendly',hashtags:true};TS.img=null;$('tb').innerHTML=`<div class="lb">منبع کپشن</div>${seg('src',[['text','متن'],['image','تصویر'],['video','ویدئو']],'text').replace(/onclick="pick\(this,'src'\)"/g,'onclick="capSrc(this)"')}<div id="cs"></div>
 <div class="lb">پلتفرم</div>${seg('platform',[['instagram','اینستاگرام'],['eitaa','ایتا'],['telegram','تلگرام'],['linkedin','لینکدین'],['general','عمومی']],'instagram')}
 <div class="lb">لحن</div>${seg('tone',[['friendly','صمیمی'],['formal','رسمی'],['sales','تبلیغاتی'],['fun','شوخ'],['poetic','ادبی']],'friendly')}
 <div class="lb">هشتگ</div>${seg('hashtags',[['true','با هشتگ'],['false','بدون هشتگ']],'true')}`+costLine()+`<button class="btn w" id="sb" onclick="capGo(this)">بنویس</button><div id="pg"></div><div id="rs"></div>`;capSrc(document.querySelector('[data-k=src] button'))}
function capSrc(b){const par=b.parentNode;par.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));TS.opt.src=b.dataset.v;TS.file=null;TS.img=null;TS.sec=0;const v=b.dataset.v;
 $('cs').innerHTML=v==='text'?`<textarea id="ct" placeholder="درباره‌ی چه چیزی کپشن بنویسم؟ (محصول، رویداد، ایده…)" style="min-height:110px"></textarea>`:dropHTML(v==='image'?'🖼️':'🎞️',v==='image'?'image/*':'video/*',v==='image'?'تصویر را انتخاب کنید':'ویدئو را انتخاب کنید')+`<textarea id="ct" placeholder="توضیح اضافه (اختیاری)" style="min-height:70px;margin-top:10px"></textarea>`;
 if(v==='image'){const inp=$('cs').querySelector('input');inp.onchange=async()=>{const f=inp.files[0];if(!f)return;$('fnm').textContent=f.name;$('pv').innerHTML=`<img class="prev" src="${URL.createObjectURL(f)}">`;try{TS.img=await _s(f,1024,.82,'image/jpeg',false)}catch(e){toast('تصویر خوانده نشد')}}}
 updCost()}
async function capGo(btn){const o=TS.opt;if(btn.disabled)return;const txt=($('ct')&&$('ct').value||'').trim();$('rs').innerHTML='';
  if(o.src==='video'){if(!TS.file)return toast('ویدئو را انتخاب کنید');o.text=txt;return runJob('captionvideo',btn)}
  if(o.src==='image'&&!TS.img)return toast('تصویر را انتخاب کنید');if(o.src==='text'&&txt.length<3)return toast('متن را بنویسید');
  btn.disabled=true;$('rs').innerHTML='<div class="sub" style="text-align:center;margin-top:12px">در حال نوشتن…</div>';
  try{const j=await api('/api/ai/caption',{text:txt,image:o.src==='image'?TS.img:undefined,platform:o.platform,tone:o.tone,hashtags:o.hashtags});setBal(j.bal);showCaps(j.text)}catch(e){if(e.j&&e.j.bal!=null)setBal(e.j.bal);$('rs').innerHTML=`<div class="er">${esc(errMsg(e))}</div>`}btn.disabled=false}
function showCaps(t){const parts=t.split(/\n\s*-{3,}\s*\n/).map(s=>s.trim()).filter(Boolean);$('rs').innerHTML=parts.map((p,i)=>`<div class="res"><div class="sub">پیشنهاد ${fn(i+1)}</div><div class="txt">${esc(p)}</div><button class="btn g sm w" onclick="copy(this.previousElementSibling.textContent)">کپی</button></div>`).join('')}
async function runText(kind,btn){const t=$('st').value.trim();if(t.length<80)return toast(ERR.len);btn.disabled=true;$('rs').innerHTML='<div class="sub" style="text-align:center;margin-top:12px">در حال خلاصه‌سازی…</div>';
  try{const j=await api('/api/ai/summarize',{text:t,style:TS.opt.style});setBal(j.bal);$('rs').innerHTML=`<div class="res"><div class="txt">${esc(j.text)}</div><button class="btn g sm w" onclick="copy(this.previousElementSibling.textContent)">کپی</button></div>`}catch(e){if(e.j&&e.j.bal!=null)setBal(e.j.bal);$('rs').innerHTML=`<div class="er">${esc(errMsg(e))}</div>`}btn.disabled=false}
/* کپشن ویدئو از مسیر job می‌گذرد؛ گزینه‌ها همراه x-opts ارسال می‌شود */
const _show=showRes;showRes=function(j){if(TS&&TS.t.id==='sticker'){showStk(j);return}if(TS&&TS.t.id==='caption'&&j.text){showCaps(j.text);return}_show(j)};

/* ============ صفحهٔ ورود با کد پیامکی (اولین ورود؛ قابل‌رد‌کردن برای تست رایگان) ============ */
const GATE_WAIT=3*864e5;
function gateShow(){if($('gate'))return;const p=$('p-profile');if(p)p.innerHTML='';phGate=true;phSt={step:0,ph:'',t:0};
 const e=document.createElement('div');e.id='gate';e.setAttribute('role','dialog');
 e.innerHTML=ctOK()?`<div class="gc"><img src="logo.png" alt=""><div class="gt">ورود به آرتو</div><div class="gs">برای استفاده از آرتو، شماره‌ات را از خود ایتا به اشتراک بگذار. حساب، اعتبار و پلن‌هایت روی شماره‌ی خودت می‌ماند و با گوشی دیگر هم از دست نمی‌رود.</div><div class="card" id="phc">${phHTML()}</div><div class="gn">🔒 شماره فقط برای نگه‌داشتن حسابت است؛ به کسی داده نمی‌شود و پیام تبلیغاتی پیامکی نمی‌گیری.</div></div>`
  :`<div class="gc"><img src="logo.png" alt=""><div class="gt">ورود به آرتو</div><div class="gs">با شمارهٔ موبایل وارد شو تا اعتبار و پلن‌هایت همیشه روی شمارهٔ خودت بماند و با هر گوشی یا مرورگر در دسترس باشد.</div><div class="card" id="phc">${phHTML()}</div><button class="btn g gk" onclick="gateSkip()">رد کردن و شروع با تست رایگان</button><div class="gn">هر وقت خواستی از بخش «پروفایل» هم می‌توانی شمارهٔ خودت را ثبت کنی.</div></div>`;
 document.body.appendChild(e);requestAnimationFrame(()=>e.classList.add('on'))}
function gateClose(ok){phGate=false;const e=$('gate');if(!e)return;if(ok)LS.s('arto_gate','ok');e.classList.remove('on');setTimeout(()=>e.remove(),300)}
function gateSkip(){LS.s('arto_gate',String(Date.now()));phSt={step:0,ph:'',t:0};gateClose(false);toast('خوش آمدی؛ از تست رایگان استفاده کن')}
function gateDue(){if(U&&ctOK())return !U.pv&&!U.pc;   /* داخل ایتا: اجباری و بدون «رد کردن» */
 if(!cfg||!cfg.sms||!U||U.pv)return false;const g=LS.g('arto_gate');if(g==='ok')return false;const t=+g||0;return !t||Date.now()-t>GATE_WAIT}
/* ============ شروع ============ */
(async function boot(){
  try{cfg=await fetch(API+'/api/config').then(r=>r.json());const j=await api('/api/me');ME=j;setUser(j.user);
   const ew=W&&W.initDataUnsafe&&W.initDataUnsafe.user;if(!j.user.name&&ew&&ew.first_name)api('/api/profile',{name:ew.first_name}).then(r=>setUser(r.user)).catch(()=>{});
   go('home');claimRef();setTimeout(()=>{$('boot').style.opacity=0;setTimeout(()=>$('boot').remove(),500)},500);
   const m=/#w=([0-9a-f]+)/.exec(location.hash);const ord=m?m[1]:LS.g('arto_ord');if(j.login)toast('حساب قبلی‌ات در ایتا پیدا شد و وارد شدی ✓');if(ord)waitPay(ord);if((!ord||ctOK())&&gateDue())setTimeout(gateShow,700);
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  }catch(e){$('bootmsg').innerHTML='اتصال به سرور برقرار نشد.<br><button class="btn sm" style="margin-top:12px" onclick="location.reload()">تلاش دوباره</button>'}
})();
</script>
